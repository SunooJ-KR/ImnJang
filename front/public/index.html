<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임앤장 — 아파트 비교</title>
<meta name="description" content="관심 있는 아파트를 담아서 같은 기준으로 나란히 비교합니다.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1>임앤장</h1>
  <p class="tagline">관심 아파트를 담아서 같은 기준으로 비교합니다</p>
</header>

<main>
  <!-- S1 검색 -->
  <section id="search-section" aria-labelledby="search-title">
    <h2 id="search-title" class="sr-only">단지 검색</h2>
    <label for="q" class="sr-only">단지명 또는 법정동</label>
    <input id="q" type="search" placeholder="단지명 또는 동 이름 (예: 래미안, 대치동)" autocomplete="off">
    <p id="search-status" class="status" role="status">인덱스를 불러오는 중입니다…</p>
    <ul id="results" class="results"></ul>
  </section>

  <!-- S3 비교서 -->
  <section id="compare-section" aria-labelledby="compare-title" hidden>
    <h2 id="compare-title">비교서</h2>
    <div id="compare" class="compare"></div>
  </section>
</main>

<!-- S2 담은 목록 -->
<div id="basket" class="basket" hidden>
  <span id="basket-label" class="basket-label"></span>
  <div class="basket-actions">
    <button type="button" id="btn-compare">비교하기</button>
    <button type="button" id="btn-clear" class="secondary">비우기</button>
  </div>
</div>

<footer class="foot">
  <p>실거래가는 국토교통부 공개 자료입니다. 추정값은 모델 산출이며 실제 거래가가 아닙니다.</p>
  <p>향·호수·실내 상태·소음은 데이터로 알 수 없습니다. 현장 확인이 필요합니다.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
